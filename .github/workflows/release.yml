name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip Binary
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/speed-test

      - name: Create Archive
        shell: bash
        run: |
          mkdir release

          cp README.md release/

          if [[ "${{ matrix.os }}" == "windows-latest" ]]
          then
            cp target/${{ matrix.target }}/release/speed-test.exe release/

            powershell -Command \
            "Compress-Archive -Path release/* -DestinationPath speed-test-${{ matrix.target }}.zip"

          else
            cp target/${{ matrix.target }}/release/speed-test release/

            tar -czf speed-test-${{ matrix.target }}.tar.gz -C release .
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            *.tar.gz
